name: supabase-keepalive

# Prevents the Supabase free-tier project from auto-pausing after 7 days of
# inactivity. OPTIONAL: works without any paid hosting (GitHub Actions is
# free for public repos, 2,000 min/month for private). Runs on a schedule even
# when your own devices are switched off.
#
# Local test: npm run keepalive   (from the repo root, with scripts/keepalive/.env set)

on:
  schedule:
    # "0 3 1,5,9,13,17,21,25,29 * *" - ~every 4 days at 03:00 UTC, keeping well
    # inside Supabase's 7-day inactivity window even if one run is missed.
    - cron: "0 3 1,5,9,13,17,21,25,29 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Push access so the tick below can reset GitHub's 60-day inactivity
    # timer; without pushes GitHub silently pauses scheduled workflows.
    permissions:
      contents: write
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install + build
        run: npm --prefix scripts/keepalive ci && npm --prefix scripts/keepalive run build
      - name: Ping Supabase
        run: npm --prefix scripts/keepalive run start
      - name: Tick to keep this workflow from being paused
        if: success()
        run: |
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          echo "tick $(date -u +%Y-%m-%dT%H:%M:%SZ)" > docs/keepalive-tick.txt
          git add docs/keepalive-tick.txt
          git commit -m "keepalive tick $(date -u +%Y-%m-%d)" || exit 0
          git push origin HEAD:main